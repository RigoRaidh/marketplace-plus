<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Plus</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Poppins:wght@400;600;700&family=Rubik:wght@400;600&family=Inter:wght@400;600&family=Roboto:wght@400;700&family=Ubuntu:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Default Theme Variables */
            --bg-color: #0b132b;
            --accent-color: #1c7ed6;
            --accent-color-2: #0f4c75;
            --accent-color-3: #3282b8;
            
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-color: #ffffff;
            --font-family: 'Poppins', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Screen Fit & Horizontal Scroll Fix */
        html, body {
            background-color: var(--bg-color);
            color: var(--font-color);
            font-family: var(--font-family);
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden; 
        }

        /* SCROLL LOCK CLASS for overlays */
        body.no-scroll {
            overflow: hidden !important;
            touch-action: none;
        }

        /* Animated Background Blobs */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: var(--bg-color);
            overflow: hidden;
            transition: background 0.3s ease;
            transform: translateZ(0); 
            will-change: transform;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: blob-float 15s infinite alternate ease-in-out;
            transition: background 0.3s ease;
            transform: translateZ(0);
            will-change: transform;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--accent-color); animation-delay: 0s; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: var(--accent-color-2); animation-delay: -5s; }
        .blob-3 { top: 30%; left: 40%; width: 40vw; height: 40vw; background: var(--accent-color-3); animation-delay: -10s; }

        @keyframes blob-float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15vw, 15vh) scale(1.3); }
        }

        /* Liquid Glass UI Base */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            color: var(--font-color);
        }

        /* Header Layout */
        .glass-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 20px;
            transform: translateZ(0);
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            margin: 0 auto;
        }
        .search-box:focus-within { 
            transform: scale(1.02);
            border-color: var(--accent-color);
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--font-color);
            margin-left: 12px;
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
        }
        .search-box input::placeholder { color: var(--font-color); opacity: 0.6; }
        
        .clear-search-btn {
            display: none;
            cursor: pointer;
            opacity: 0.7;
            margin-left: 10px;
            font-size: 1.1rem;
            transition: opacity 0.2s ease;
        }
        .clear-search-btn:hover { opacity: 1; color: var(--accent-color); }

        /* Controls (Filters & Menus) - High Z-Index */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 30px 20px;
            position: relative;
            z-index: 9999;
        }

        .filters {
            display: flex;
            gap: 6px;
            padding: 6px;
            border-radius: 20px;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            max-width: 100%;
        }

        .filters button, .settings-trigger {
            background: transparent;
            border: none;
            color: var(--font-color);
            font-size: 1.1rem; 
            width: 42px;       
            height: 42px;      
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .filters button.active, .filters button:hover, .settings-trigger:hover, .settings-dropdown-wrapper.open .settings-trigger {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .settings-divider {
            width: 1px;
            height: 30px;
            background: var(--glass-border);
            margin: 0 5px;
            flex-shrink: 0;
        }

        .settings-dropdown-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* The Dropdown Menu - Cut-Off Bug Fixed */
        .settings-dropdown {
            position: absolute;
            top: calc(100% + 15px);
            right: 0; /* Anchors strictly to the right side of the button */
            width: 190px; /* Shrunk width to prevent screen clipping */
            border-radius: 15px;
            padding: 10px 0;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            background: rgba(11, 19, 43, 0.98);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overscroll-behavior: contain;
        }
        .settings-dropdown-wrapper.open .settings-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown-item {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s ease;
            font-size: 0.95rem;
            color: #fff;
            user-select: none;
        }
        .dropdown-item i { width: 20px; text-align: center; }
        .dropdown-item:hover, .dropdown-item.active {
            background: rgba(255, 255, 255, 0.15);
        }
        .tiny-divider {
            border: none;
            border-top: 1px solid var(--glass-border);
            margin: 5px 0;
            opacity: 0.5;
        }

        /* Main Elements Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 0 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1; 
        }

        /* LAG FIX: Removed blur from scrolling cards, purely glass styles */
        .card {
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; 
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            content-visibility: auto;
            contain-intrinsic-size: 300px;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.4);
        }
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }
        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .card:hover .card-img-wrapper img { transform: scale(1.05); }

        .card-content {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 8px;
        }
        .card-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            background: rgba(255,255,255,0.15);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .loading, .no-items { grid-column: 1 / -1; text-align: center; padding: 50px; font-size: 1.2rem; opacity: 0.8; }
        
        /* Shared Modal System */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            overscroll-behavior: contain;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content-box {
            width: 90%;
            padding: 25px;
            border-radius: 20px;
            transform: translateY(30px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content-box { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        .icon-btn-close {
            background: transparent; border: none; color: white;
            font-size: 1.2rem; cursor: pointer; transition: transform 0.2s ease;
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn-close:hover { transform: scale(1.1); }

        /* ITEM PREVIEW OVERLAY */
        .item-modal {
            max-width: 600px;
            padding: 0 !important;
            overflow: hidden !important;
        }
        .item-modal-img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }
        .item-modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .modal-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            opacity: 0.9;
            margin: 15px 0 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }
        .modal-desc-area {
            font-size: 0.95rem;
            line-height: 1.6;
            max-height: 180px;
            overflow-y: auto;
            color: #e2e8f0;
            padding-right: 5px;
            margin-bottom: 15px;
        }
        .modal-desc-area::-webkit-scrollbar { width: 6px; }
        .modal-desc-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 10px; }

        .card-links { display: flex; flex-direction: column; gap: 10px; }
        .download-btn {
            padding: 14px 18px;
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            color: var(--font-color);
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            font-weight: 600;
            cursor: pointer;
        }
        .download-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }

        /* INFO MODAL OVERLAY */
        .info-modal { max-width: 400px; }
        .discord-large-btn {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background: #5865F2; color: #fff; text-decoration: none;
            padding: 14px 20px; border-radius: 14px; font-weight: 600; font-size: 1.1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .discord-large-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .stat-badge {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .stat-badge i { width: 18px; text-align: center; }
        .stat-badge b { margin-left: auto; color: var(--accent-color); font-size: 1.1rem; }

        /* Settings Forms */
        .setting-group { display: flex; flex-direction: column; gap: 8px; }
        .setting-group label { font-size: 0.9rem; opacity: 0.9; font-weight: 600; }
        .setting-group input[type="color"] {
            appearance: none; -webkit-appearance: none; border: none; width: 100%; height: 45px;
            border-radius: 12px; cursor: pointer; background: transparent; padding: 0;
        }
        .setting-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .setting-group input[type="color"]::-webkit-color-swatch { border: none; border-radius: 12px; }
        .custom-font-select {
            width: 100%; padding: 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border); color: var(--font-color);
            font-family: inherit; font-size: 1rem; outline: none; cursor: pointer;
        }
        .custom-font-select option { background: #0b132b; }

        /* Responsive UI Scaling */
        @media (max-width: 768px) {
            .glass-header {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            .search-box { max-width: 100%; }
            .grid { padding: 0 20px 40px; gap: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 400px) {
            .filters button, .settings-trigger {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .filters { gap: 4px; padding: 5px; }
            .settings-divider { margin: 0 2px; }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header glass">
        <div class="logo">
            <i class="fas fa-cubes"></i> Marketplace Plus
        </div>
        <div class="search-box glass">
            <i class="fas fa-search"></i>
            <input type="text" id="search" placeholder="Search for addons, worlds, skins...">
            <i class="fas fa-times clear-search-btn" id="clearSearch" title="Clear Search"></i>
        </div>
    </header>

    <div class="controls">
        <div class="filters glass" id="categoryFilters">
            <button data-cat="all" class="active" title="All"><i class="fas fa-infinity"></i></button>
            <button data-cat="addons" title="Addons"><i class="fas fa-puzzle-piece"></i></button>
            <button data-cat="worlds" title="Worlds"><i class="fas fa-globe"></i></button>
            <button data-cat="textures" title="Texture Packs"><i class="fas fa-image"></i></button>
            <button data-cat="skins" title="Skins"><i class="fas fa-tshirt"></i></button>
            <button data-cat="mashups" title="Mashups"><i class="fas fa-layer-group"></i></button>
            
            <div class="settings-divider"></div>
            
            <div class="settings-dropdown-wrapper" id="settingsWrapper">
                <button class="settings-trigger" id="settingsBtn" title="Menu"><i class="fas fa-sliders-h"></i></button>
                <div class="settings-dropdown glass">
                    <div class="dropdown-item sort-opt active" data-action="sort" data-value="random"><i class="fas fa-random"></i> Default</div>
                    <div class="dropdown-item sort-opt" data-action="sort" data-value="newest"><i class="fas fa-arrow-up"></i> Newest</div>
                    <div class="dropdown-item sort-opt" data-action="sort" data-value="oldest"><i class="fas fa-arrow-down"></i> Oldest</div>
                    <div class="dropdown-item sort-opt" data-action="sort" data-value="az">
                        <i style="display:inline-flex; flex-direction:column; font-size:0.6rem; align-items:center; line-height:1;">
                            <span>A</span><i class="fas fa-arrow-down" style="font-size:0.7rem; margin:1px 0;"></i><span>Z</span>
                        </i> Name [A-Z]
                    </div>
                    <hr class="tiny-divider">
                    <div class="dropdown-item" data-action="theme"><i class="fas fa-palette"></i> Theme</div>
                    <div class="dropdown-item" data-action="info"><i class="fas fa-info-circle"></i> Information</div>
                </div>
            </div>
        </div>
    </div>

    <main id="grid" class="grid"></main>

    <div id="itemModal" class="modal-overlay">
        <div class="modal-content-box item-modal glass">
            <div style="position: relative;">
                <img id="modalImg" class="item-modal-img" src="" alt="">
                <button id="closeItemModal" class="glass icon-btn-close" style="position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); border-radius: 50%;"><i class="fas fa-times"></i></button>
            </div>
            <div class="item-modal-body">
                <h2 id="modalTitle" style="margin: 0; font-size: 1.4rem;"></h2>
                
                <div class="modal-meta-bar">
                    <span id="modalCategory" class="card-category" style="margin: 0; padding: 4px 10px; font-size: 0.7rem; background: var(--accent-color);"></span>
                    <span id="modalRating" style="color: #f39c12; font-weight: 600;"><i class="fas fa-star"></i> <span></span></span>
                    <span id="modalCreator" style="opacity: 0.8;"><i class="fas fa-user" style="margin-right:5px;"></i> <span></span></span>
                </div>
                
                <div id="modalDesc" class="modal-desc-area"></div>
                <div id="modalDownloads" class="card-links"></div>
            </div>
        </div>
    </div>

    <div id="themeModal" class="modal-overlay">
        <div class="modal-content-box glass" style="max-width: 400px;">
            <div class="modal-header">
                <h2><i class="fas fa-palette"></i> Theme Settings</h2>
                <button class="icon-btn-close closeThemeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="setting-group"><label>Background Color</label><input type="color" id="bgColorPicker" value="#0b132b"></div>
            <div class="setting-group"><label>Accent Color</label><input type="color" id="accentColorPicker" value="#1c7ed6"></div>
            <div class="setting-group"><label>Glass Tint</label><input type="color" id="glassColorPicker" value="#ffffff"></div>
            <div class="setting-group"><label>Font Color</label><input type="color" id="fontColorPicker" value="#ffffff"></div>
            <div class="setting-group">
                <label>Font Type</label>
                <select id="fontSelect" class="custom-font-select">
                    <option value="'Poppins', sans-serif">Poppins</option>
                    <option value="'Montserrat', sans-serif">Montserrat</option>
                    <option value="'Rubik', sans-serif">Rubik</option>
                    <option value="'Oswald', sans-serif">Oswald</option>
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Roboto', sans-serif">Roboto</option>
                    <option value="'Ubuntu', sans-serif">Ubuntu</option>
                    <option value="'Press Start 2P', cursive">Press Start 2P</option>
                </select>
            </div>
            <button id="resetThemeBtn" class="download-btn" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #ff6b6b; justify-content: center; margin-top:10px;">
                <i class="fas fa-undo"></i> Reset Theme
            </button>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay">
        <div class="modal-content-box glass info-modal">
            <div class="modal-header">
                <h2><i class="fas fa-info-circle"></i> Information</h2>
                <button class="icon-btn-close closeInfoModal"><i class="fas fa-times"></i></button>
            </div>
            
            <div style="margin: 10px 0 20px;">
                <a href="https://discord.gg/JfDBAtfFGM" target="_blank" class="discord-large-btn">
                    <i class="fab fa-discord" style="font-size: 1.5rem;"></i> Join our Discord
                </a>
            </div>
            
            <h3 style="margin-top:10px; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; font-size: 1.1rem; opacity: 0.9;">
                <i class="fas fa-chart-bar"></i> Live Statistics
            </h3>
            
            <div class="stats-grid">
                <div class="stat-badge"><i class="fas fa-infinity"></i> All <b id="stat-all">0</b></div>
                <div class="stat-badge"><i class="fas fa-puzzle-piece"></i> Addons <b id="stat-addons">0</b></div>
                <div class="stat-badge"><i class="fas fa-globe"></i> Worlds <b id="stat-worlds">0</b></div>
                <div class="stat-badge"><i class="fas fa-image"></i> Textures <b id="stat-textures">0</b></div>
                <div class="stat-badge"><i class="fas fa-tshirt"></i> Skins <b id="stat-skins">0</b></div>
                <div class="stat-badge"><i class="fas fa-layer-group"></i> Mashups <b id="stat-mashups">0</b></div>
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('search');
        const clearBtn = document.getElementById('clearSearch');
        
        let items = [];
        let filteredItems = [];
        let loadedCount = 0;
        const BATCH_SIZE = 12; 
        let currentCategory = 'all';
        let sortMode = 'random';
        let searchQuery = '';
        let searchDebounceTimer; 

        let globalStats = { all: 0, addons: 0, worlds: 0, textures: 0, skins: 0, mashups: 0 };
        const defaultTheme = { bg: '#0b132b', accent: '#1c7ed6', glass: '#ffffff', fontCol: '#ffffff', fontFam: "'Poppins', sans-serif" };

        // HELPER: Toggle background scroll locking perfectly to stop lag & scrolling
        function toggleBodyScroll(shouldLock) {
            if (shouldLock) {
                document.body.classList.add('no-scroll');
            } else {
                const isModalOpen = document.querySelector('.modal-overlay.active');
                const isMenuOpen = document.getElementById('settingsWrapper').classList.contains('open');
                if (!isModalOpen && !isMenuOpen) {
                    document.body.classList.remove('no-scroll');
                }
            }
        }

        function formatCategory(cat) {
            const map = { 'addons': 'Addon', 'worlds': 'World', 'textures': 'Texture', 'skins': 'Skin', 'mashups': 'Mashup' };
            return map[cat] || cat;
        }

        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateTheme() {
            const root = document.documentElement;
            const bg = document.getElementById('bgColorPicker').value;
            const accent = document.getElementById('accentColorPicker').value;
            const glass = document.getElementById('glassColorPicker').value;
            const fontCol = document.getElementById('fontColorPicker').value;
            const fontFam = document.getElementById('fontSelect').value;

            root.style.setProperty('--bg-color', bg);
            root.style.setProperty('--accent-color', accent);
            root.style.setProperty('--accent-color-2', hexToRgba(accent, 0.7));
            root.style.setProperty('--accent-color-3', hexToRgba(accent, 0.4));
            root.style.setProperty('--glass-bg', hexToRgba(glass, 0.1));
            root.style.setProperty('--glass-border', hexToRgba(glass, 0.2));
            root.style.setProperty('--font-color', fontCol);
            root.style.setProperty('--font-family', fontFam);

            localStorage.setItem('mkplus-theme', JSON.stringify({ bg, accent, glass, fontCol, fontFam }));
        }

        function loadTheme() {
            const saved = localStorage.getItem('mkplus-theme');
            if (saved) {
                const theme = JSON.parse(saved);
                document.getElementById('bgColorPicker').value = theme.bg;
                document.getElementById('accentColorPicker').value = theme.accent;
                document.getElementById('glassColorPicker').value = theme.glass;
                document.getElementById('fontColorPicker').value = theme.fontCol;
                document.getElementById('fontSelect').value = theme.fontFam;
                updateTheme();
            }
        }

        ['bgColorPicker', 'accentColorPicker', 'glassColorPicker', 'fontColorPicker', 'fontSelect'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateTheme);
        });

        document.getElementById('resetThemeBtn').addEventListener('click', () => {
            document.getElementById('bgColorPicker').value = defaultTheme.bg;
            document.getElementById('accentColorPicker').value = defaultTheme.accent;
            document.getElementById('glassColorPicker').value = defaultTheme.glass;
            document.getElementById('fontColorPicker').value = defaultTheme.fontCol;
            document.getElementById('fontSelect').value = defaultTheme.fontFam;
            updateTheme();
        });

        function processHTML(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            const itemNodes = doc.querySelectorAll('.item');
            const linkNodes = doc.querySelectorAll('.item-links');
            
            const linksMap = {};
            linkNodes.forEach(linkNode => {
                const uuid = linkNode.getAttribute('data-uuid');
                const dls = Array.from(linkNode.querySelectorAll('.download-link')).map(a => {
                    const url = a.href;
                    const typeEl = a.querySelector('.link-text span');
                    const sizeEl = a.querySelector('.file-size');
                    return { 
                        url: url, 
                        type: typeEl ? typeEl.textContent.trim() : null, 
                        size: sizeEl ? sizeEl.textContent.trim() : ''
                    };
                });
                linksMap[uuid] = dls;
            });

            globalStats = { all: 0, addons: 0, worlds: 0, textures: 0, skins: 0, mashups: 0 };

            items = Array.from(itemNodes).map((node, index) => {
                const uuid = node.getAttribute('data-uuid');
                const category = node.getAttribute('data-category') || 'addons';
                
                globalStats.all++;
                if (globalStats[category] !== undefined) globalStats[category]++;

                const titleEl = node.querySelector('h2');
                const imgEl = node.querySelector('.img-wrapper img') || node.querySelector('img');
                const creatorEl = node.querySelector('.item-creator');
                const descEl = node.querySelector('.description');
                const ratingEl = node.querySelector('.item-rating');
                
                return {
                    id: index,
                    randomOrder: Math.random(),
                    uuid, 
                    category, 
                    title: titleEl ? titleEl.textContent.trim() : 'Unknown', 
                    img: imgEl ? (imgEl.getAttribute('src') || '') : '',
                    creator: creatorEl ? creatorEl.textContent.trim() : 'Unknown Creator',
                    description: descEl ? descEl.innerHTML : 'No description available.',
                    rating: ratingEl ? ratingEl.textContent.trim() : null,
                    downloads: linksMap[uuid] || []
                };
            });

            document.getElementById('stat-all').textContent = globalStats.all;
            document.getElementById('stat-addons').textContent = globalStats.addons;
            document.getElementById('stat-worlds').textContent = globalStats.worlds;
            document.getElementById('stat-textures').textContent = globalStats.textures;
            document.getElementById('stat-skins').textContent = globalStats.skins;
            document.getElementById('stat-mashups').textContent = globalStats.mashups;

            applyFilters();
        }

        async function loadDatabase() {
            grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin fa-2x"></i><p><br>Fetching Data...</p></div>';
            try {
                const response = await fetch('database.html');
                if (!response.ok) throw new Error('Database block');
                const html = await response.text();
                processHTML(html);
            } catch (err) {
                grid.innerHTML = '<div class="no-items"><i class="fas fa-exclamation-circle"></i> Connection Failed. Ensure database.html resides in the root server folder.</div>';
            }
        }

        function getSearchRelevance(title, query) {
            const t = title.toLowerCase().trim();
            const q = query.toLowerCase().trim();
            if (t === q) return 100;
            if (t.startsWith(q)) return 80;
            if (t.includes(q)) return 50;
            let score = 0, qIdx = 0;
            for (let i = 0; i < t.length; i++) {
                if (t[i] === q[qIdx]) { qIdx++; score += 2; }
            }
            return score;
        }

        function fuzzyMatch(query, text) {
            if (!query) return true;
            const q = query.toLowerCase().replace(/[^a-z0-9]/g, '');
            const t = text.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (t.includes(q)) return true;
            let qIdx = 0;
            for (let i = 0; i < t.length; i++) {
                if (t[i] === q[qIdx]) qIdx++;
                if (qIdx === q.length) return true;
            }
            return false;
        }

        /* FIXED SORTING LOGIC: 
           Newest = Highest ID (Items at the bottom of the list)
           Oldest = Lowest ID (Items at the top of the list)
        */
        function applySortComparison(a, b) {
            if (sortMode === 'random') return a.randomOrder - b.randomOrder;
            if (sortMode === 'newest') return b.id - a.id; // High ID first
            if (sortMode === 'oldest') return a.id - b.id; // Low ID first
            if (sortMode === 'az') return a.title.localeCompare(b.title);
            return 0;
        }

        function applyFilters() {
            let result = items.filter(item => {
                if (currentCategory !== 'all' && item.category !== currentCategory) return false;
                if (searchQuery) return fuzzyMatch(searchQuery, item.title);
                return true;
            });

            if (searchQuery) {
                result.sort((a, b) => {
                    const scoreA = getSearchRelevance(a.title, searchQuery);
                    const scoreB = getSearchRelevance(b.title, searchQuery);
                    if (scoreB !== scoreA) return scoreB - scoreA;
                    return applySortComparison(a, b);
                });
            } else {
                result.sort((a, b) => applySortComparison(a, b));
            }
            
            filteredItems = result;
            loadedCount = 0;
            grid.innerHTML = '';
            
            if (filteredItems.length === 0) {
                grid.innerHTML = '<div class="no-items">No items found matching your criteria.</div>';
            } else {
                loadMore();
            }
        }

        /* FAST RENDERING via HTML String to prevent visual lag */
        function loadMore() {
            const toLoad = filteredItems.slice(loadedCount, loadedCount + BATCH_SIZE);
            if (toLoad.length === 0) return;

            let htmlString = '';
            toLoad.forEach(item => {
                htmlString += `
                    <div class="card" data-id="${item.id}">
                        <div class="card-img-wrapper">
                            <img src="${item.img}" loading="lazy" alt="${item.title}">
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${item.title}</h3>
                            <span class="card-category">${formatCategory(item.category)}</span>
                        </div>
                    </div>
                `;
            });
            
            grid.insertAdjacentHTML('beforeend', htmlString);
            loadedCount += toLoad.length;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadDatabase();
            
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                clearBtn.style.display = searchQuery.length > 0 ? 'block' : 'none';
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(applyFilters, 250); 
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearBtn.style.display = 'none';
                applyFilters();
            });
            
            document.querySelectorAll('#categoryFilters button[data-cat]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#categoryFilters button[data-cat]').forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentCategory = target.getAttribute('data-cat');
                    applyFilters();
                });
            });

            const settingsWrapper = document.getElementById('settingsWrapper');
            document.getElementById('settingsBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                settingsWrapper.classList.toggle('open');
                toggleBodyScroll(settingsWrapper.classList.contains('open'));
            });

            document.addEventListener('click', (e) => {
                if (!settingsWrapper.contains(e.target)) {
                    if (settingsWrapper.classList.contains('open')) {
                        settingsWrapper.classList.remove('open');
                        toggleBodyScroll(false);
                    }
                }
            });

            const themeModal = document.getElementById('themeModal');
            const infoModal = document.getElementById('infoModal');

            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const action = item.getAttribute('data-action');
                    const value = item.getAttribute('data-value');

                    if (action === 'sort') {
                        document.querySelectorAll('.dropdown-item.sort-opt').forEach(opt => opt.classList.remove('active'));
                        item.classList.add('active');
                        sortMode = value;
                        applyFilters();
                        settingsWrapper.classList.remove('open');
                        toggleBodyScroll(false);
                    } else if (action === 'theme') {
                        themeModal.classList.add('active');
                        settingsWrapper.classList.remove('open');
                        toggleBodyScroll(true);
                    } else if (action === 'info') {
                        infoModal.classList.add('active');
                        settingsWrapper.classList.remove('open');
                        toggleBodyScroll(true);
                    }
                });
            });

            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => { 
                    if(e.target === overlay) {
                        overlay.classList.remove('active');
                        toggleBodyScroll(false);
                    } 
                });
            });
            
            document.querySelectorAll('.closeThemeModal').forEach(btn => btn.addEventListener('click', () => {
                themeModal.classList.remove('active');
                toggleBodyScroll(false);
            }));
            
            document.querySelectorAll('.closeInfoModal').forEach(btn => btn.addEventListener('click', () => {
                infoModal.classList.remove('active');
                toggleBodyScroll(false);
            }));
            
            document.getElementById('closeItemModal').addEventListener('click', () => {
                document.getElementById('itemModal').classList.remove('active');
                toggleBodyScroll(false);
            });

            grid.addEventListener('click', (e) => {
                const card = e.target.closest('.card');
                if (!card) return;
                
                const itemId = parseInt(card.getAttribute('data-id'));
                const item = filteredItems.find(i => i.id === itemId);
                if (!item) return;

                document.getElementById('modalImg').src = item.img;
                document.getElementById('modalTitle').textContent = item.title;
                document.getElementById('modalCategory').textContent = formatCategory(item.category);
                document.getElementById('modalCreator').querySelector('span').textContent = item.creator;
                
                const ratingEl = document.getElementById('modalRating');
                if (item.rating && item.rating !== 'Unrated') {
                    ratingEl.style.display = 'inline-block';
                    ratingEl.querySelector('span').textContent = item.rating;
                } else {
                    ratingEl.style.display = 'none';
                }

                document.getElementById('modalDesc').innerHTML = item.description;

                const dlsContainer = document.getElementById('modalDownloads');
                if (item.downloads.length > 0) {
                    dlsContainer.innerHTML = item.downloads.map(dl => {
                        const linkName = (dl.type && dl.type !== 'Download') ? dl.type : formatCategory(item.category);
                        return `
                            <a href="${dl.url}" target="_blank" class="download-btn">
                                <span style="display:flex; align-items:center; gap:10px;"><i class="fas fa-download"></i> ${linkName.toUpperCase()}</span>
                                ${dl.size ? `<span style="font-size:0.85rem; opacity:0.8;">${dl.size}</span>` : ''}
                            </a>
                        `;
                    }).join('');
                } else {
                    dlsContainer.innerHTML = '<span class="no-download">No download links available</span>';
                }

                document.getElementById('itemModal').classList.add('active');
                toggleBodyScroll(true);
            });

            let scrollFrameActive = false;
            window.addEventListener('scroll', () => {
                if (!scrollFrameActive) {
                    window.requestAnimationFrame(() => {
                        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                            if (loadedCount < filteredItems.length) loadMore();
                        }
                        scrollFrameActive = false;
                    });
                    scrollFrameActive = true;
                }
            });
        });
    </script>
</body>
</html>
