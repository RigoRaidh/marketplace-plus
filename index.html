<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Marketplace Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700&family=Rubik:wght@400;500;600;700&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&family=Ubuntu:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
/* ========== CSS VARIABLES ========== */
:root {
  --bg:           #060c1f;
  --bg2:          #0b1230;
  --accent:       #4b8ef5;
  --accent2:      #7b5fe8;
  --glass-bg:     rgba(255,255,255,0.055);
  --glass-border: rgba(255,255,255,0.11);
  --btn-bg:       rgba(255,255,255,0.08);
  --btn-hover:    rgba(255,255,255,0.16);
  --text:         #f0f4ff;
  --text2:        #8da0c4;
  --card-bg:      #111a35;
  --card-border:  rgba(100,140,255,0.14);
  --tag-addon:    #4b8ef5;
  --tag-world:    #2ec47a;
  --tag-texture:  #e07f2a;
  --tag-skin:     #e04b8a;
  --tag-mashup:   #a84be8;
  --font:         'Poppins', sans-serif;
  --shadow:       0 8px 32px rgba(0,0,0,0.55);
  --radius:       14px;
  --header-h:     68px;
  --ctrl-h:       54px;
}

/* ========== RESET ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;overscroll-behavior:none}
html.no-scroll,html.no-scroll body{overflow:hidden!important;height:100vh!important;overscroll-behavior:none!important}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  position: relative;
}
button{cursor:pointer;font-family:var(--font)}
input,select{font-family:var(--font)}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.28)}

/* ========== BACKGROUND BLOBS ========== */
.blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{
  position:absolute;border-radius:50%;filter:blur(90px);
  transform:translateZ(0);will-change:transform;opacity:0.38;
}
.blob-1{
  width:700px;height:700px;top:-200px;left:-200px;
  background:radial-gradient(circle,#1f3dbf,transparent 70%);
  animation:blobFloat1 22s ease-in-out infinite;
}
.blob-2{
  width:600px;height:600px;bottom:-150px;right:-100px;
  background:radial-gradient(circle,#6b2fbf,transparent 70%);
  animation:blobFloat2 28s ease-in-out infinite;
}
.blob-3{
  width:500px;height:500px;top:40%;left:50%;transform:translate(-50%,-50%) translateZ(0);
  background:radial-gradient(circle,#0f4480,transparent 70%);
  animation:blobFloat3 19s ease-in-out infinite;
}
@keyframes blobFloat1{0%,100%{transform:translate(0,0) translateZ(0)}50%{transform:translate(60px,80px) translateZ(0)}}
@keyframes blobFloat2{0%,100%{transform:translate(0,0) translateZ(0)}50%{transform:translate(-80px,-60px) translateZ(0)}}
@keyframes blobFloat3{0%,100%{transform:translate(-50%,-50%) translateZ(0)}50%{transform:translate(-50%,-44%) translateZ(0)}}

/* ========== LOADER ========== */
#loader{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:rgba(6,12,31,0.97);backdrop-filter:blur(8px);
  transition:opacity 0.4s ease,visibility 0.4s ease;
}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-box{text-align:center}
.loader-ring{
  width:56px;height:56px;border:3px solid rgba(255,255,255,0.1);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.9s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.loader-sub{font-size:0.8rem;color:var(--text2)}

/* ========== HEADER ========== */
header{
  position:fixed;top:0;left:0;right:0;z-index:500;
  height:var(--header-h);
  background:rgba(6,12,31,0.78);
  backdrop-filter:blur(22px) saturate(1.4);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;padding:0 20px;gap:14px;
}

.logo{
  display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;
  user-select:none;
  transition:transform 0.2s;
}
.logo:hover{transform:scale(1.03)}
.logo-icon{
  width:34px;height:34px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:#fff;flex-shrink:0;
}
.logo-text{font-size:1.05rem;font-weight:700;white-space:nowrap}
.logo-text span{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.search-bar{
  flex:1;min-width:0;max-width:500px;margin:0 auto;
  position:relative;
}
.search-bar input{
  width:100%;height:38px;padding:0 38px 0 38px;
  background:var(--btn-bg);border:1px solid var(--glass-border);
  border-radius:10px;color:var(--text);font-size:0.85rem;
  outline:none;transition:border-color 0.2s,background 0.2s;
}
.search-bar input::placeholder{color:var(--text2)}
.search-bar input:focus{border-color:rgba(75,142,245,0.5);background:rgba(255,255,255,0.1)}
.search-bar .s-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text2);font-size:0.85rem;pointer-events:none;
}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--text2);font-size:0.9rem;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
}
.search-clear.visible{opacity:1;pointer-events:auto}
.search-clear:hover{color:var(--text)}

.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--glass-border);
  background:var(--btn-bg);color:var(--text);display:flex;align-items:center;justify-content:center;
  font-size:0.9rem;transition:all 0.2s;flex-shrink:0;
}
.hdr-btn:hover{background:var(--btn-hover);transform:scale(1.04)}
.hdr-btn.active{background:rgba(75,142,245,0.22);border-color:rgba(75,142,245,0.4)}

/* ========== CONTROLS BAR ========== */
.controls-bar{
  position:fixed;top:var(--header-h);left:0;right:0;z-index:499;
  height:var(--ctrl-h);
  background:rgba(6,12,31,0.72);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;padding:0 20px;gap:10px;
}

.filter-scroll{
  display:flex;align-items:center;gap:7px;
  overflow-x:auto;flex:1;min-width:0;
  scrollbar-width:none;-ms-overflow-style:none;
  padding-bottom:2px;
}
.filter-scroll::-webkit-scrollbar{display:none}

.filter-btn{
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  padding:0 13px;height:32px;border-radius:20px;
  border:1px solid var(--glass-border);background:var(--btn-bg);
  color:var(--text2);font-size:0.78rem;font-weight:500;
  transition:all 0.2s;flex-shrink:0;
}
.filter-btn i{font-size:0.78rem}
.filter-btn:hover{background:var(--btn-hover);color:var(--text)}
.filter-btn.active{
  background:rgba(75,142,245,0.2);
  border-color:rgba(75,142,245,0.5);
  color:var(--accent);
}

.ctrl-divider{width:1px;height:22px;background:var(--glass-border);flex-shrink:0}

/* ========== SETTINGS DROPDOWN ========== */
.settings-wrap{position:relative;flex-shrink:0}
.settings-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;
  min-width:190px;
  background:rgba(10,18,45,0.95);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--glass-border);
  border-radius:12px;padding:8px 0;
  box-shadow:var(--shadow);z-index:10000;
  opacity:0;visibility:hidden;
  transform:translateY(-8px) scale(0.97);
  transition:all 0.2s ease;
  transform-origin:top right;
}
.settings-dropdown.open{
  opacity:1;visibility:visible;
  transform:translateY(0) scale(1);
}
.dd-section{
  padding:6px 12px 4px;
  font-size:0.68rem;color:var(--text2);
  text-transform:uppercase;letter-spacing:0.08em;font-weight:600;
}
.dd-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;font-size:0.85rem;color:var(--text);
  cursor:pointer;transition:background 0.15s;
}
.dd-item:hover{background:var(--btn-hover)}
.dd-item.active{color:var(--accent)}
.dd-item i{width:15px;text-align:center;font-size:0.8rem;color:var(--text2)}
.dd-item.active i{color:var(--accent)}
.dd-item .star-gold{color:#f5c518}
.dd-sep{height:1px;background:var(--glass-border);margin:5px 0}

/* ========== MAIN CONTENT ========== */
main{
  position:relative;z-index:1;
  padding-top:calc(var(--header-h) + var(--ctrl-h) + 24px);
  padding-bottom:60px;
  min-height:100vh;
}

/* ========== GRID ========== */
.grid{
  max-width:1340px;margin:0 auto;
  padding:0 18px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px;
}

/* ========== CARDS ========== */
.card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;
  cursor:pointer;
  transition:transform 0.25s ease,box-shadow 0.25s ease,border-color 0.25s;
  contain:layout style;
  position:relative;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 40px rgba(0,0,0,0.55);
  border-color:rgba(100,160,255,0.28);
}
.card-thumb{width:100%;aspect-ratio:16/9;overflow:hidden;background:#070e24;position:relative}
.card-thumb img{
  width:100%;height:100%;object-fit:cover;
  transition:transform 0.3s ease,opacity 0.4s;
  opacity:0;
}
.card-thumb img.loaded{opacity:1}
.card:hover .card-thumb img{transform:scale(1.06)}
.card-body{padding:11px 13px 13px}
.card-title{
  font-size:0.875rem;font-weight:600;
  color:var(--text);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:8px;
}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:20px;
  font-size:0.68rem;font-weight:600;
  text-transform:uppercase;letter-spacing:0.06em;
}
.card-creator{font-size:0.72rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.card-rating{
  display:none;align-items:center;gap:3px;
  font-size:0.72rem;color:#f5c518;font-weight:600;
  background:rgba(245,197,24,0.12);
  padding:3px 8px;border-radius:20px;
  margin-left:auto;flex-shrink:0;
}
.card-rating i{font-size:0.62rem}
.sort-highrated .card-rating{display:inline-flex}

/* Tag colors */
.tag-addon{background:rgba(75,142,245,0.18);color:#6fa8ff}
.tag-world{background:rgba(46,196,122,0.18);color:#4dd89a}
.tag-texture{background:rgba(224,127,42,0.18);color:#f59a4f}
.tag-skin{background:rgba(224,75,138,0.18);color:#f56ea8}
.tag-mashup{background:rgba(168,75,232,0.18);color:#c078f5}

/* ========== OVERLAY BACKDROP ========== */
.overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.72);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;visibility:hidden;
  transition:opacity 0.28s ease,visibility 0.28s ease;
}
.overlay.active{opacity:1;visibility:visible}

/* ========== ITEM DETAIL MODAL ========== */
.item-modal{
  background:rgba(9,14,38,0.96);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border:1px solid var(--glass-border);
  border-radius:18px;
  width:100%;max-width:580px;
  max-height:92vh;
  overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  transform:translateY(18px) scale(0.97);
  transition:transform 0.28s ease;
  scrollbar-width:thin;
  scrollbar-color:var(--btn-hover) transparent;
}
.overlay.active .item-modal{transform:translateY(0) scale(1)}
.item-modal::-webkit-scrollbar{width:5px}
.item-modal::-webkit-scrollbar-thumb{background:var(--btn-hover);border-radius:10px}

.modal-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:18px 18px 0;gap:12px;
}
.modal-title-col{flex:1;min-width:0}
.modal-title{font-size:1.1rem;font-weight:700;line-height:1.3;margin-bottom:4px}
.modal-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.modal-close{
  width:34px;height:34px;border-radius:8px;
  background:var(--btn-bg);border:1px solid var(--glass-border);
  color:var(--text2);font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.modal-close:hover{background:var(--btn-hover);color:var(--text)}

.modal-creator{font-size:0.78rem;color:var(--text2);padding:0 18px;margin-top:5px}
.modal-creator span{color:var(--accent)}

/* SLIDER */
.modal-slider{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#070e24;overflow:hidden;margin-top:14px;
}
.slider-track{display:flex;height:100%;transition:transform 0.38s cubic-bezier(.25,.1,.25,1)}
.slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;background:#070e24}
.slide img{width:100%;height:100%;object-fit:contain;background:#070e24}
.slide iframe{width:100%;height:100%;border:none}
.slide.pan img{object-fit:cover}

.sl-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;
  background:rgba(6,12,31,0.7);border:1px solid rgba(255,255,255,0.2);
  color:#fff;font-size:0.85rem;
  display:none;align-items:center;justify-content:center;
  transition:all 0.2s;z-index:5;backdrop-filter:blur(6px);
}
.sl-btn:hover{background:rgba(75,142,245,0.4)}
.sl-prev{left:8px}
.sl-next{right:8px}
.sl-up{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:30px;height:22px;border-radius:6px;
  background:rgba(6,12,31,0.7);border:1px solid rgba(255,255,255,0.2);
  color:#fff;font-size:0.7rem;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
  cursor:pointer;transition:all 0.2s;z-index:5;
}
.sl-up:hover{background:rgba(75,142,245,0.4)}
.sl-dots{
  position:absolute;bottom:8px;left:0;right:0;
  display:flex;justify-content:center;gap:6px;z-index:5;pointer-events:none;
}
.sl-dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,0.35);
  transition:all 0.2s;pointer-events:auto;cursor:pointer;
}
.sl-dot.active{background:#fff;transform:scale(1.2)}
.pan-slider{
  position:absolute;left:20%;right:20%;bottom:10px;height:3px;z-index:6;
  display:none;accent-color:#4b8ef5;opacity:0.9;
}

/* MODAL BODY */
.modal-body{padding:14px 18px 18px}

.modal-rating{
  display:flex;align-items:center;gap:5px;
  font-size:0.85rem;color:#f5c518;font-weight:600;margin-bottom:12px;
}
.modal-rating i{font-size:0.78rem}
.modal-rating .tot{font-size:0.75rem;color:var(--text2);font-weight:400}

.modal-desc{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-border);border-radius:10px;
  padding:12px 14px;margin-bottom:16px;
  font-size:0.83rem;line-height:1.55;color:var(--text2);
  max-height:130px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--btn-hover) transparent;
}
.modal-desc::-webkit-scrollbar{width:4px}
.modal-desc::-webkit-scrollbar-thumb{background:var(--btn-hover);border-radius:10px}

.modal-dl-title{font-size:0.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px;font-weight:600}

.dl-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--btn-hover) transparent}
.dl-list::-webkit-scrollbar{width:4px}
.dl-list::-webkit-scrollbar-thumb{background:var(--btn-hover);border-radius:10px}
.dl-btn{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--btn-bg);border:1px solid var(--glass-border);
  border-radius:10px;padding:11px 14px;
  color:var(--text);transition:all 0.2s;
  text-decoration:none;
}
.dl-btn:hover{background:var(--btn-hover);transform:translateY(-2px);border-color:rgba(75,142,245,0.3)}
.dl-left{display:flex;align-items:center;gap:9px;min-width:0}
.dl-icon{font-size:1rem;flex-shrink:0;color:var(--accent)}
.dl-label{font-size:0.82rem;font-weight:500}
.dl-right{display:flex;align-items:center;gap:8px}
.dl-size{font-size:0.75rem;color:var(--text2);white-space:nowrap}
.dl-arrow{font-size:0.8rem;color:var(--text2)}
.modal-no-dl{font-size:0.82rem;color:var(--text2);text-align:center;padding:16px 0}

.modal-actions{
  display:flex;align-items:center;gap:8px;margin-top:14px;
}
.action-btn{
  flex:1;height:38px;border-radius:9px;border:1px solid var(--glass-border);
  background:var(--btn-bg);color:var(--text);font-size:0.8rem;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all 0.2s;
}
.action-btn:hover{background:var(--btn-hover)}
.action-btn.fav-active{border-color:rgba(240,70,70,0.5);background:rgba(240,70,70,0.12);color:#f55}
.action-btn.fav-active i{color:#f55}

/* ========== THEME MODAL ========== */
.theme-modal{
  background:rgba(9,14,38,0.97);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid var(--glass-border);border-radius:18px;
  width:100%;max-width:440px;
  max-height:92vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  transform:translateY(18px) scale(0.97);
  transition:transform 0.28s ease;
  scrollbar-width:thin;scrollbar-color:var(--btn-hover) transparent;
}
.overlay.active .theme-modal{transform:none}
.theme-modal::-webkit-scrollbar{width:5px}
.theme-modal::-webkit-scrollbar-thumb{background:var(--btn-hover);border-radius:10px}
.tm-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 14px}
.tm-head h2{font-size:1.1rem;font-weight:700}
.tm-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:18px}

.tm-row{display:flex;flex-direction:column;gap:6px}
.tm-label{font-size:0.73rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;font-weight:600}
.tm-color{width:100%;height:42px;border:1px solid var(--glass-border);border-radius:9px;cursor:pointer;background:transparent;padding:2px}
.tm-fonts{display:flex;flex-wrap:wrap;gap:7px}
.font-opt{
  padding:7px 12px;border-radius:8px;border:1px solid var(--glass-border);
  background:var(--btn-bg);color:var(--text2);font-size:0.78rem;
  transition:all 0.2s;
}
.font-opt:hover{background:var(--btn-hover);color:var(--text)}
.font-opt.active{background:rgba(75,142,245,0.18);border-color:rgba(75,142,245,0.5);color:var(--accent)}
.tm-actions{display:flex;gap:10px;padding-top:4px}
.tm-save{
  flex:1;height:40px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;font-size:0.85rem;font-weight:600;
  transition:opacity 0.2s;
}
.tm-save:hover{opacity:0.88}
.tm-reset{
  flex:1;height:40px;border-radius:9px;
  background:var(--btn-bg);border:1px solid var(--glass-border);
  color:var(--text2);font-size:0.85rem;transition:all 0.2s;
}
.tm-reset:hover{background:var(--btn-hover);color:var(--text)}

/* ========== INFO MODAL ========== */
.info-modal{
  background:rgba(9,14,38,0.97);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid var(--glass-border);border-radius:18px;
  width:100%;max-width:420px;
  max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  transform:translateY(18px) scale(0.97);
  transition:transform 0.28s ease;
}
.overlay.active .info-modal{transform:none}
.im-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0}
.im-head h2{font-size:1.1rem;font-weight:700}
.im-body{padding:18px}

.discord-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:48px;border-radius:12px;
  background:linear-gradient(135deg,#5865F2,#7289da);
  border:none;color:#fff;font-size:0.95rem;font-weight:700;
  text-decoration:none;
  transition:opacity 0.2s,transform 0.2s;
  box-shadow:0 4px 20px rgba(88,101,242,0.4);
  margin-bottom:22px;
}
.discord-btn:hover{opacity:0.88;transform:translateY(-2px)}
.discord-btn i{font-size:1.2rem}

.stats-title{font-size:0.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;font-weight:600}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{
  background:var(--btn-bg);border:1px solid var(--glass-border);
  border-radius:10px;padding:12px;
  display:flex;align-items:center;gap:10px;
  transition:background 0.2s;
}
.stat-card:hover{background:var(--btn-hover)}
.stat-card.full{grid-column:1/-1}
.stat-icon{font-size:1.3rem;flex-shrink:0}
.stat-info{display:flex;flex-direction:column}
.stat-num{font-size:1.1rem;font-weight:700}
.stat-lbl{font-size:0.68rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em}

/* ========== STATES ========== */
.no-results,.loading-more{
  grid-column:1/-1;text-align:center;
  padding:60px 20px;color:var(--text2);
}
.no-results i,.loading-more i{font-size:2rem;margin-bottom:10px;display:block}
.no-results p,.loading-more p{font-size:0.95rem}

.end-msg{
  text-align:center;padding:30px;
  color:var(--text2);font-size:0.8rem;grid-column:1/-1;
}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  :root{--header-h:58px;--ctrl-h:48px}
  header{padding:0 14px;gap:10px}
  .logo-text{display:none}
  .logo-icon{width:30px;height:30px}
  .controls-bar{padding:0 12px;gap:8px}
  .filter-btn{padding:0 10px;height:30px;font-size:0.73rem}
  .grid{padding:0 12px;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .card-title{font-size:0.78rem;-webkit-line-clamp:1}
  .card-tag{font-size:0.63rem;padding:2px 7px}
  .item-modal,.theme-modal,.info-modal{border-radius:14px;max-height:95vh}
  .modal-title{font-size:0.95rem}
  .overlay{padding:12px}
  .settings-dropdown{right:0;max-width:calc(100vw - 28px)}
}
@media(max-width:420px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .stats-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:769px) and (max-width:1100px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

/* ========== FADE ANIMATIONS ========== */
.card{animation:cardIn 0.32s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ========== TOAST ========== */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(9,14,38,0.95);backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:10px;
  padding:10px 18px;font-size:0.83rem;color:var(--text);
  opacity:0;transition:all 0.28s ease;z-index:2000;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
'use strict';
(function(){

/* ========== CONSTANTS ========== */
const ITEMS_PER_PAGE = 12;
const DEBOUNCE_MS = 250;
const DISCORD = 'https://discord.gg/JfDBAtfFGM';
const DB_FILE = 'database.html';

const CAT_LABELS = {all:'All',addons:'Addon',worlds:'World',textures:'Texture',skins:'Skin',mashups:'Mashup'};
const CAT_ICONS  = {all:'fa-border-all',addons:'fa-puzzle-piece',worlds:'fa-globe',textures:'fa-image',skins:'fa-tshirt',mashups:'fa-layer-group'};
const CAT_STAT_ICONS = {total:'fa-box-open',addons:'fa-puzzle-piece',worlds:'fa-globe',textures:'fa-image',skins:'fa-tshirt',mashups:'fa-layer-group'};
const TAG_CLASSES = {addons:'tag-addon',worlds:'tag-world',textures:'tag-texture',skins:'tag-skin',mashups:'tag-mashup'};
const FONTS_MAP = {
  "'Poppins',sans-serif":'Poppins',
  "'Montserrat',sans-serif":'Montserrat',
  "'Rubik',sans-serif":'Rubik',
  "'Oswald',sans-serif":'Oswald',
  "'Inter',sans-serif":'Inter',
  "'Roboto',sans-serif":'Roboto',
  "'Ubuntu',sans-serif":'Ubuntu',
  "'Press Start 2P',monospace":'8-Bit'
};
const DEFAULT_THEME = {
  bg:'#060c1f',accent:'#4b8ef5',glass:'#0b1230',text:'#f0f4ff',
  font:"'Poppins',sans-serif"
};

/* ========== STATE ========== */
let allItems = [];          // full parsed item list
let dlMap = {};             // uuid → [{url,label,size,icon}]
let stats = {total:0,addons:0,worlds:0,textures:0,skins:0,mashups:0};
let filteredItems = [];     // current view
let currentCat = 'all';
let currentSort = 'random';
let currentSearch = '';
let currentPage = 0;
let isLoading = false;
let hasMore = true;
let overlayItem = null;     // item data for open modal
let favs = new Set();
let showFavs = false;
let sliderState = null;
let searchTimeout = null;
let rafScrollId = null;
let lastScrollY = 0;

/* ========== INIT ========== */
window.addEventListener('DOMContentLoaded', async () => {
  loadFavs();
  loadTheme();
  try {
    const html = await fetch(DB_FILE).then(r => r.text());
    parseDatabase(html);
    buildStatsUI();
  } catch(e) {
    console.error('DB load failed', e);
  }
  initUI();
  applySort(); // sets filteredItems and renders
  setTimeout(() => {
    document.getElementById('loader').classList.add('hidden');
  }, 900);
});

/* ========== DATABASE PARSING ========== */
function parseDatabase(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  // Parse items
  const itemEls = doc.querySelectorAll('.item[data-uuid]');
  itemEls.forEach((el, idx) => {
    const uuid = el.getAttribute('data-uuid') || '';
    const category = (el.getAttribute('data-category') || 'addons').toLowerCase();
    const titleEl = el.querySelector('h2');
    const imgEl   = el.querySelector('.img-wrapper img');
    const creatorEl = el.querySelector('.item-creator');
    const descEl  = el.querySelector('.description');
    const ratingEl = el.querySelector('.item-rating');
    const totalEl  = el.querySelector('.item-total-ratings');

    const title   = titleEl ? titleEl.textContent.trim() : '';
    const image   = imgEl   ? imgEl.getAttribute('src') || '' : '';
    const creator = creatorEl ? creatorEl.textContent.trim() : '';
    const description = descEl ? descEl.innerHTML : '';

    let ratingVal = 0;
    if (ratingEl) {
      const rt = ratingEl.textContent.trim();
      const num = parseFloat(rt);
      if (!isNaN(num)) ratingVal = num;
    }
    let totalRatings = '';
    if (totalEl) totalRatings = totalEl.textContent.trim();

    // YouTube from .yt-embed
    let ytId = null;
    const ytEl = el.querySelector('.yt-embed');
    if (ytEl) {
      ytId = extractYTId(ytEl.textContent.trim());
    }

    // Extra images
    const extraImgs = [];
    el.querySelectorAll('[class^="img-wrapper"]').forEach(w => {
      if (w.classList.contains('img-wrapper')) return;
      const ei = w.querySelector('img');
      if (ei) extraImgs.push(ei.getAttribute('src') || '');
    });
    // Sort by class number
    extraImgs.sort();

    // Panorama
    let panorama = null;
    const panEl = el.querySelector('.panorama-url');
    if (panEl) panorama = panEl.textContent.trim() || null;

    if (!title || !uuid) return;

    const item = {
      uuid, category: normalCat(category),
      title, image, creator, description,
      rating: ratingVal, totalRatings,
      htmlIndex: idx,
      ytId, extraImgs, panorama
    };
    allItems.push(item);

    // Stats
    stats.total++;
    const sc = item.category;
    if (stats[sc] !== undefined) stats[sc]++;
  });

  // Parse download links
  const dlContainers = doc.querySelectorAll('.item-links[data-uuid]');
  dlContainers.forEach(cont => {
    const uuid = cont.getAttribute('data-uuid') || '';
    if (!uuid) return;
    const links = [];
    cont.querySelectorAll('a.download-link').forEach(a => {
      const url = a.getAttribute('href') || '';
      const labelEl = a.querySelector('.link-text span');
      const label = labelEl ? labelEl.textContent.trim() : 'Download';
      const sizeEl = a.querySelector('.file-size');
      const size = sizeEl ? sizeEl.textContent.trim() : '';
      const iconEl = a.querySelector('.link-icon');
      const iconClass = iconEl ? iconEl.className : '';
      links.push({url, label, size, iconClass});
    });
    if (links.length) dlMap[uuid] = links;
  });
}

function normalCat(c) {
  if (c === 'world' || c === 'worlds') return 'worlds';
  if (c === 'addon' || c === 'addons') return 'addons';
  if (c === 'texture' || c === 'textures') return 'textures';
  if (c === 'skin' || c === 'skins') return 'skins';
  if (c === 'mashup' || c === 'mashups') return 'mashups';
  return c;
}

function extractYTId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:[^/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

/* ========== STATS UI ========== */
function buildStatsUI() {
  const sg = document.getElementById('statsGrid');
  const cats = ['total','addons','worlds','textures','skins','mashups'];
  const colors = {total:'var(--accent)',addons:'#6fa8ff',worlds:'#4dd89a',textures:'#f59a4f',skins:'#f56ea8',mashups:'#c078f5'};
  let html = '';
  cats.forEach(c => {
    const full = c === 'total' ? 'full' : '';
    const label = c === 'total' ? 'Total Items' : CAT_LABELS[c] + 's';
    html += `<div class="stat-card ${full}">
      <div class="stat-icon" style="color:${colors[c]}"><i class="fas ${CAT_STAT_ICONS[c]||'fa-box'}"></i></div>
      <div class="stat-info"><div class="stat-num">${stats[c]||0}</div><div class="stat-lbl">${label}</div></div>
    </div>`;
  });
  sg.innerHTML = html;
}

/* ========== FAVOURITES ========== */
function loadFavs() {
  try { favs = new Set(JSON.parse(localStorage.getItem('mp_favs')||'[]')); } catch(e){ favs = new Set(); }
}
function saveFavs() { try { localStorage.setItem('mp_favs', JSON.stringify([...favs])); } catch(e){} }
function toggleFav(uuid) {
  if (favs.has(uuid)) favs.delete(uuid); else favs.add(uuid);
  saveFavs();
  return favs.has(uuid);
}

/* ========== THEME ========== */
function loadTheme() {
  try {
    const t = JSON.parse(localStorage.getItem('mp_theme')||'{}');
    applyTheme(t);
    // Sync UI
    if (t.bg) document.getElementById('tBg').value = t.bg;
    if (t.accent) document.getElementById('tAccent').value = t.accent;
    if (t.glass) document.getElementById('tGlass').value = t.glass;
    if (t.text) document.getElementById('tText').value = t.text;
    if (t.font) {
      document.querySelectorAll('.font-opt').forEach(b => {
        b.classList.toggle('active', b.dataset.f === t.font);
      });
    }
  } catch(e){}
}
function applyTheme(t) {
  const r = document.documentElement.style;
  if (t.bg) { r.setProperty('--bg',t.bg); r.setProperty('--bg2',t.bg); r.setProperty('--card-bg',darken(t.bg)); }
  if (t.accent) r.setProperty('--accent',t.accent);
  if (t.glass) r.setProperty('--glass-bg',hex2rgba(t.glass,0.055));
  if (t.text) r.setProperty('--text',t.text);
  if (t.font) { r.setProperty('--font',t.font); document.body.style.fontFamily=t.font; }
}
function saveTheme(t) { try { localStorage.setItem('mp_theme',JSON.stringify(t)); } catch(e){} }
function hex2rgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function darken(hex){
  try{
    const r=Math.max(0,parseInt(hex.slice(1,3),16)-8);
    const g=Math.max(0,parseInt(hex.slice(3,5),16)-8);
    const b=Math.max(0,parseInt(hex.slice(5,7),16)+15);
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){return '#111a35'}
}

/* ========== SORT & FILTER ========== */
function applySort() {
  let base = [...allItems];

  // Category filter
  if (currentCat !== 'all') base = base.filter(i => i.category === currentCat);

  // Favs filter
  if (showFavs) base = base.filter(i => favs.has(i.uuid));

  // Search filter
  if (currentSearch) {
    const q = currentSearch.toLowerCase().replace(/[^a-z0-9]/g,'');
    base = base.map(i => {
      const t = (i.title||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      const c = (i.creator||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      let score = 0;
      if (t === q || c === q) score = 100;
      else if (t.startsWith(q) || c.startsWith(q)) score = 80;
      else if (t.includes(q) || c.includes(q)) score = 50;
      return {item: i, score};
    }).filter(x => x.score > 0)
      .sort((a,b) => b.score - a.score)
      .map(x => x.item);
  } else {
    // Sort
    switch(currentSort) {
      case 'newest': base.sort((a,b) => b.htmlIndex - a.htmlIndex); break;
      case 'oldest': base.sort((a,b) => a.htmlIndex - b.htmlIndex); break;
      case 'name':   base.sort((a,b) => a.title.localeCompare(b.title)); break;
      case 'highrated':
        base.sort((a,b) => {
          const diff = b.rating - a.rating;
          return diff !== 0 ? diff : b.htmlIndex - a.htmlIndex;
        }); break;
      default: // random
        for (let i=base.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[base[i],base[j]]=[base[j],base[i]];}
    }
  }

  filteredItems = base;
  currentPage = 0;
  hasMore = true;

  // Toggle star class on grid
  const grid = document.getElementById('grid');
  grid.classList.toggle('sort-highrated', currentSort === 'highrated');

  renderGrid(true);
}

/* ========== RENDER ========== */
function renderGrid(reset) {
  const grid = document.getElementById('grid');
  if (reset) { grid.innerHTML = ''; currentPage = 0; }

  if (!filteredItems.length && reset) {
    grid.innerHTML = `<div class="no-results"><i class="fas fa-search"></i><p>No items found</p></div>`;
    hasMore = false;
    return;
  }

  const start = currentPage * ITEMS_PER_PAGE;
  const end   = Math.min(start + ITEMS_PER_PAGE, filteredItems.length);
  hasMore = end < filteredItems.length;

  const frag = document.createDocumentFragment();
  const slice = filteredItems.slice(start, end);
  let html = '';
  slice.forEach(item => {
    html += buildCard(item);
  });

  // Use a temp div then append
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  Array.from(tmp.children).forEach(el => {
    frag.appendChild(el);
  });
  grid.appendChild(frag);

  // Lazy load images
  grid.querySelectorAll('.card-thumb img[data-src]').forEach(img => {
    lazyObserver.observe(img);
  });

  currentPage++;
}

function buildCard(item) {
  const cat = item.category || 'addons';
  const tagClass = TAG_CLASSES[cat] || 'tag-addon';
  const catLabel = CAT_LABELS[cat] || cat;
  const ratingHtml = `<span class="card-rating"><i class="fas fa-star"></i>${item.rating.toFixed(1)}</span>`;

  return `<div class="card" data-uuid="${escHtml(item.uuid)}">
    <div class="card-thumb">
      <img data-src="${escHtml(item.image)}" alt="${escHtml(item.title)}" loading="lazy"/>
    </div>
    <div class="card-body">
      <div class="card-title">${escHtml(item.title)}</div>
      <div class="card-meta">
        <span class="card-tag ${tagClass}"><i class="fas ${CAT_ICONS[cat]||'fa-box'}"></i> ${catLabel}</span>
        <span class="card-creator">${escHtml(item.creator)}</span>
        ${ratingHtml}
      </div>
    </div>
  </div>`;
}

/* ========== LAZY IMAGE LOADING ========== */
const lazyObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const img = e.target;
      const src = img.getAttribute('data-src');
      if (src) {
        img.setAttribute('src', src);
        img.removeAttribute('data-src');
        img.onload = () => img.classList.add('loaded');
        img.onerror = () => img.classList.add('loaded');
      }
      lazyObserver.unobserve(img);
    }
  });
}, { rootMargin: '200px' });

/* ========== INFINITE SCROLL ========== */
function onScroll() {
  const st = window.scrollY;
  if (st === lastScrollY) return;
  lastScrollY = st;
  const bottom = document.documentElement.scrollHeight - window.innerHeight;
  if (st > bottom - 350 && !isLoading && hasMore) {
    isLoading = true;
    setTimeout(() => {
      renderGrid(false);
      isLoading = false;
    }, 200);
  }
}

window.addEventListener('scroll', () => {
  if (rafScrollId) return;
  rafScrollId = requestAnimationFrame(() => {
    onScroll();
    rafScrollId = null;
  });
}, {passive:true});

/* ========== CARD CLICK → ITEM MODAL ========== */
document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const uuid = card.getAttribute('data-uuid');
  const item = allItems.find(i => i.uuid === uuid);
  if (!item) return;
  openItemModal(item);
});

function openItemModal(item) {
  overlayItem = item;

  // Title + badges
  document.getElementById('mTitle').textContent = item.title;
  const cat = item.category;
  const tc = TAG_CLASSES[cat] || 'tag-addon';
  document.getElementById('mBadges').innerHTML = `<span class="card-tag ${tc}"><i class="fas ${CAT_ICONS[cat]||'fa-box'}"></i> ${CAT_LABELS[cat]||cat}</span>`;
  document.getElementById('mCreator').innerHTML = `By <span>${escHtml(item.creator)}</span>`;

  // Rating
  const mRat = document.getElementById('mRating');
  if (item.rating > 0) {
    mRat.style.display = 'flex';
    mRat.innerHTML = `<i class="fas fa-star"></i>${item.rating.toFixed(1)} <span class="tot">${item.totalRatings}</span>`;
  } else {
    mRat.style.display = 'none';
  }

  // Description
  const mDesc = document.getElementById('mDesc');
  if (item.description) {
    mDesc.style.display = 'block';
    mDesc.innerHTML = item.description;
  } else {
    mDesc.style.display = 'none';
  }

  // Downloads
  const dlList = document.getElementById('dlList');
  const links = dlMap[item.uuid] || [];
  if (links.length) {
    dlList.innerHTML = links.map(l => {
      const iconCls = l.iconClass.includes('fa-tshirt') ? 'fa-tshirt'
                     : l.iconClass.includes('fa-image') ? 'fa-image'
                     : l.iconClass.includes('fa-globe') ? 'fa-globe'
                     : 'fa-puzzle-piece';
      return `<a class="dl-btn" href="${escHtml(l.url)}" target="_blank" rel="noopener noreferrer">
        <div class="dl-left">
          <span class="dl-icon"><i class="fas ${iconCls}"></i></span>
          <span class="dl-label">${escHtml(l.label)}</span>
        </div>
        <div class="dl-right">
          <span class="dl-size">${escHtml(l.size)}</span>
          <span class="dl-arrow"><i class="fas fa-external-link-alt"></i></span>
        </div>
      </a>`;
    }).join('');
  } else {
    dlList.innerHTML = '<div class="modal-no-dl">No download links available</div>';
  }

  // Fav button
  updateFavBtn();

  // Slider
  buildSlider(item);

  lockScroll();
  document.getElementById('itemOverlay').classList.add('active');
}

function updateFavBtn() {
  if (!overlayItem) return;
  const isFav = favs.has(overlayItem.uuid);
  const btn = document.getElementById('mFavBtn');
  btn.classList.toggle('fav-active', isFav);
  document.getElementById('mFavTxt').textContent = isFav ? 'Unfavourite' : 'Add to Favourites';
}

function closeItemModal() {
  document.getElementById('itemOverlay').classList.remove('active');
  destroySlider();
  overlayItem = null;
  unlockScroll();
}

document.getElementById('itemClose').addEventListener('click', closeItemModal);
document.getElementById('itemOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('itemOverlay')) closeItemModal();
});
document.getElementById('mFavBtn').addEventListener('click', () => {
  if (!overlayItem) return;
  toggleFav(overlayItem.uuid);
  updateFavBtn();
  showToast(favs.has(overlayItem.uuid) ? '❤️ Added to favourites' : 'Removed from favourites');
});
document.getElementById('mShareBtn').addEventListener('click', () => {
  if (!overlayItem) return;
  const txt = `${overlayItem.title} | Marketplace Plus`;
  navigator.clipboard?.writeText(txt).then(() => showToast('Copied to clipboard!')).catch(()=>{});
});

/* ========== SLIDER ========== */
function buildSlider(item) {
  const track = document.getElementById('sliderTrack');
  const dots  = document.getElementById('slDots');
  const prev  = document.getElementById('slPrev');
  const next  = document.getElementById('slNext');
  const up    = document.getElementById('slUp');
  const pan   = document.getElementById('panSlider');

  track.innerHTML = '';
  dots.innerHTML = '';
  prev.style.display = next.style.display = up.style.display = 'none';
  pan.style.display = 'none';

  const slides = [];
  // thumbnail
  if (item.image) slides.push({type:'img', src: item.image, pan:false});
  // yt
  if (item.ytId) slides.push({type:'yt', id: item.ytId});
  // extra imgs (sorted by class number already)
  item.extraImgs.forEach(src => { if(src) slides.push({type:'img',src,pan:false}); });
  // panorama
  if (item.panorama) slides.push({type:'img', src:item.panorama, pan:true});

  if (!slides.length) return;

  let curIdx = 0;
  let panMode = false;

  // Prefer YT as second slide - start on it if available
  if (slides.length > 1 && slides[1] && slides[1].type === 'yt') curIdx = 1;

  const regularSlides = slides.filter(s => !s.pan);
  const panSlide = slides.find(s => s.pan);

  function buildSlideEl(s, isPan=false) {
    const div = document.createElement('div');
    div.className = 'slide' + (isPan ? ' pan':'');
    if (s.type === 'img') {
      const img = document.createElement('img');
      img.src = s.src; img.alt='';img.loading='lazy';
      div.appendChild(img);
    } else {
      const fr = document.createElement('iframe');
      fr.src = `https://www.youtube-nocookie.com/embed/${s.id}?autoplay=0&rel=0`;
      fr.allow = 'accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture';
      fr.allowFullscreen = true;
      div.appendChild(fr);
    }
    return div;
  }

  function renderDots() {
    dots.innerHTML = '';
    regularSlides.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'sl-dot' + (i === curIdx ? ' active' : '');
      d.addEventListener('click', () => { if(!panMode){curIdx=i;renderRegular();} });
      dots.appendChild(d);
    });
  }

  function updateControls() {
    if (panMode) {
      prev.style.display='none'; next.style.display='none';
      pan.style.display = 'block';
      dots.style.display='none';
      up.style.display='flex';
      up.innerHTML='<i class="fas fa-compress-arrows-alt"></i>';
    } else {
      prev.style.display = curIdx > 0 ? 'flex' : 'none';
      next.style.display = curIdx < regularSlides.length-1 ? 'flex' : 'none';
      up.style.display = panSlide ? 'flex' : 'none';
      up.innerHTML='<i class="fas fa-expand-arrows-alt"></i>';
      pan.style.display='none';
      dots.style.display = regularSlides.length > 1 ? 'flex' : 'none';
    }
  }

  function renderRegular() {
    panMode = false;
    track.innerHTML='';
    regularSlides.forEach(s => track.appendChild(buildSlideEl(s)));
    track.style.transform = `translateX(-${curIdx*100}%)`;
    renderDots();
    updateControls();
  }

  function renderPanorama() {
    if (!panSlide) return;
    panMode = true;
    track.innerHTML='';
    track.appendChild(buildSlideEl(panSlide, true));
    track.style.transform = 'translateX(0)';
    pan.value = 0;
    const img = track.querySelector('img');
    if (img) {
      img.style.objectPosition = '0% center';
      pan.oninput = () => { img.style.objectPosition=pan.value+'% center'; };
    }
    updateControls();
  }

  prev.onclick = () => { if(!panMode && curIdx>0){ curIdx--; renderRegular(); } };
  next.onclick = () => { if(!panMode && curIdx<regularSlides.length-1){ curIdx++; renderRegular(); } };
  up.onclick   = () => { if(panMode) renderRegular(); else renderPanorama(); };

  if (!regularSlides.length && panSlide) { renderPanorama(); }
  else renderRegular();

  sliderState = {destroy:()=>{ track.innerHTML=''; }};
}

function destroySlider() {
  if (sliderState) { sliderState.destroy(); sliderState=null; }
  document.getElementById('sliderTrack').innerHTML='';
  document.getElementById('slDots').innerHTML='';
}

/* ========== SCROLL LOCK ========== */
function lockScroll(){ document.documentElement.classList.add('no-scroll'); document.body.classList.add('no-scroll'); }
function unlockScroll(){ document.documentElement.classList.remove('no-scroll'); document.body.classList.remove('no-scroll'); }

/* ========== ESC KEY ========== */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const overlays = ['itemOverlay','themeOverlay','infoOverlay'];
  overlays.forEach(id => {
    const el = document.getElementById(id);
    if (el && el.classList.contains('active')) {
      el.classList.remove('active');
      unlockScroll();
    }
  });
  if (document.getElementById('settingsDropdown').classList.contains('open')) {
    document.getElementById('settingsDropdown').classList.remove('open');
  }
});

/* ========== UI INIT ========== */
function initUI() {
  // LOGO
  document.getElementById('logo').addEventListener('click', () => {
    currentSearch = ''; document.getElementById('searchInput').value = '';
    document.getElementById('searchClear').classList.remove('visible');
    currentCat = 'all'; showFavs = false;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat==='all'));
    document.getElementById('favBtn').classList.remove('active');
    applySort();
  });

  // SEARCH
  const inp = document.getElementById('searchInput');
  const clr = document.getElementById('searchClear');
  inp.addEventListener('input', () => {
    clr.classList.toggle('visible', inp.value.length > 0);
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      currentSearch = inp.value.trim();
      applySort();
    }, DEBOUNCE_MS);
  });
  clr.addEventListener('click', () => {
    inp.value = ''; clr.classList.remove('visible');
    currentSearch = ''; applySort();
  });

  // FAV BUTTON (header)
  document.getElementById('favBtn').addEventListener('click', () => {
    showFavs = !showFavs;
    document.getElementById('favBtn').classList.toggle('active', showFavs);
    applySort();
  });

  // CATEGORY FILTERS
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat || 'all';
      applySort();
    });
  });

  // SETTINGS DROPDOWN
  const sd = document.getElementById('settingsDropdown');
  const sb = document.getElementById('settingsBtn');
  sb.addEventListener('click', e => {
    e.stopPropagation();
    sd.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!sd.contains(e.target) && e.target !== sb) sd.classList.remove('open');
  });

  // SORT OPTIONS
  sd.querySelectorAll('.dd-item[data-sort]').forEach(d => {
    d.addEventListener('click', () => {
      currentSort = d.dataset.sort;
      sd.querySelectorAll('.dd-item[data-sort]').forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      showFavs = currentSort === 'favourites';
      document.getElementById('favBtn').classList.toggle('active', showFavs);
      sd.classList.remove('open');
      applySort();
    });
  });

  // OPEN THEME
  document.getElementById('openTheme').addEventListener('click', () => {
    sd.classList.remove('open');
    lockScroll();
    document.getElementById('themeOverlay').classList.add('active');
  });

  // OPEN INFO
  document.getElementById('openInfo').addEventListener('click', () => {
    sd.classList.remove('open');
    lockScroll();
    document.getElementById('infoOverlay').classList.add('active');
  });

  // THEME MODAL
  document.getElementById('themeClose').addEventListener('click', () => {
    document.getElementById('themeOverlay').classList.remove('active');
    unlockScroll();
  });
  document.getElementById('themeOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('themeOverlay')) {
      document.getElementById('themeOverlay').classList.remove('active');
      unlockScroll();
    }
  });

  // Font opts
  document.querySelectorAll('.font-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.font-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.getElementById('tmSave').addEventListener('click', () => {
    const t = {
      bg:    document.getElementById('tBg').value,
      accent:document.getElementById('tAccent').value,
      glass: document.getElementById('tGlass').value,
      text:  document.getElementById('tText').value,
      font:  document.querySelector('.font-opt.active')?.dataset.f || DEFAULT_THEME.font
    };
    applyTheme(t); saveTheme(t);
    showToast('Theme saved!');
    document.getElementById('themeOverlay').classList.remove('active');
    unlockScroll();
  });

  document.getElementById('tmReset').addEventListener('click', () => {
    applyTheme(DEFAULT_THEME);
    saveTheme(DEFAULT_THEME);
    document.getElementById('tBg').value    = DEFAULT_THEME.bg;
    document.getElementById('tAccent').value= DEFAULT_THEME.accent;
    document.getElementById('tGlass').value = DEFAULT_THEME.glass;
    document.getElementById('tText').value  = DEFAULT_THEME.text;
    document.querySelectorAll('.font-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.f === DEFAULT_THEME.font);
    });
    showToast('Theme reset!');
  });

  // INFO MODAL
  document.getElementById('infoClose').addEventListener('click', () => {
    document.getElementById('infoOverlay').classList.remove('active');
    unlockScroll();
  });
  document.getElementById('infoOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('infoOverlay')) {
      document.getElementById('infoOverlay').classList.remove('active');
      unlockScroll();
    }
  });
}

/* ========== TOAST ========== */
let toastTm;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTm);
  toastTm = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ========== UTILS ========== */
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

})();
</script>
