<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Marketplace Plus</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Rubik:wght@500;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --card-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shine: rgba(255, 255, 255, 0.25);
            --accent: #a3d5ff;
            --text-main: #ffffff;
            --dark-bg: #0f0c29;
        }

        /* 1. ROCK SOLID BACKGROUND FIX */
        html {
            background-color: var(--dark-bg); /* Prevents the white gap at the bottom */
            height: 100%;
        }

        /* The unbreakable gradient layer */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            z-index: -1;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            min-height: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        /* 2. UI POLISH: Glowing Header */
        header { text-align: center; margin-bottom: 25px; }
        h1 { 
            font-family: 'Rubik', sans-serif; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin: 0; 
            font-size: 2em;
            background: linear-gradient(to right, #fff, #a3d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(163, 213, 255, 0.2);
        }

        /* 3. PREMIUM LIQUID GLASS EFFECT */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-shine); /* Gives the "glass edge" reflection */
            border-left: 1px solid var(--glass-shine);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .controls-container {
            max-width: 800px;
            margin: 0 auto 35px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        /* Sleeker Search Bar */
        .search-wrapper {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            padding: 4px 20px;
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(0,0,0,0.4);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }
        .search-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3), 0 0 15px rgba(163, 213, 255, 0.2);
        }
        .search-wrapper input {
            background: transparent;
            border: none;
            color: white;
            padding: 12px 10px;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
        }

        /* 4. FIX: SINGLE LINE FOR ALL CONTROLS */
        .controls-row {
            display: flex;
            gap: 8px; /* Tighter gap to fit on mobile */
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap; /* Forces them onto one line */
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .divider {
            width: 1px;
            height: 30px;
            background: var(--glass-border);
            margin: 0 4px;
        }

        /* Upgraded Icons */
        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.7);
            width: 42px; /* Perfectly sized for mobile rows */
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .icon-btn:hover, .icon-btn.active {
            background: var(--accent);
            color: #0f0c29;
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(163, 213, 255, 0.3);
        }

        /* Sort Menu Styling */
        .sort-menu {
            display: none; 
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            padding-top: 15px;
            border-top: 1px solid var(--glass-border);
            animation: slideDown 0.3s ease forwards;
        }
        .sort-menu.show { display: flex; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .pill-btn:hover, .pill-btn.active {
            background: var(--text-main);
            color: var(--dark-bg);
        }

        /* Grid & Cards Polish */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-shine);
            border-left: 1px solid var(--glass-shine);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            will-change: transform;
            transition: transform 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
        }

        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .card-info { padding: 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; }
        
        /* Upgraded Pill Tags */
        .tag-wrapper { margin-bottom: 12px; }
        .card-tag { 
            font-size: 0.65em; 
            color: var(--dark-bg); 
            background: var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 1px; 
        }
        
        .card-title { font-size: 1.1em; margin: 0 0 20px 0; min-height: 2.5em; line-height: 1.4; font-weight: 600; }
        
        .dl-container { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .dl-link {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85em;
            text-align: center;
            transition: all 0.2s ease;
        }
        .dl-link:hover { background: var(--accent); color: var(--dark-bg); border-color: var(--accent); }

        .loading-sentinel { height: 80px; grid-column: 1/-1; }
        .status-msg { grid-column: 1/-1; text-align: center; padding: 60px; font-size: 1.1em; color: rgba(255,255,255,0.5); }

        /* Media Query to ensure small screens look perfect */
        @media (max-width: 450px) {
            .icon-btn { width: 36px; height: 36px; font-size: 0.9em; }
            .controls-row { gap: 5px; }
            .grid-container { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card-title { font-size: 0.9em; min-height: 3em; }
            .dl-link { padding: 8px; font-size: 0.75em; }
            h1 { font-size: 1.6em; }
        }
    </style>
</head>
<body>

<div class="bg-layer"></div>

<header><h1>Marketplace Plus</h1></header>

<div class="controls-container glass-panel">
    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search 500+ items...">
    </div>
    
    <div class="controls-row">
        <div class="button-group">
            <button class="icon-btn active" data-cat="all" onclick="filterCat('all')" title="All"><i class="fas fa-th-large"></i></button>
            <button class="icon-btn" data-cat="worlds" onclick="filterCat('worlds')" title="Maps"><i class="fas fa-map"></i></button>
            <button class="icon-btn" data-cat="addons" onclick="filterCat('addons')" title="Addons"><i class="fas fa-puzzle-piece"></i></button>
            <button class="icon-btn" data-cat="textures" onclick="filterCat('textures')" title="Textures"><i class="fas fa-palette"></i></button>
            <button class="icon-btn" data-cat="skins" onclick="filterCat('skins')" title="Skins"><i class="fas fa-tshirt"></i></button>
        </div>

        <div class="divider"></div>

        <div class="button-group">
            <button class="icon-btn" onclick="toggleSortMenu()" title="Sort Options"><i class="fas fa-sort"></i></button>
        </div>
    </div>

    <div class="sort-menu" id="sortMenu">
        <button class="pill-btn active" data-sort="latest" onclick="sortItems('latest')">Latest</button>
        <button class="pill-btn" data-sort="oldest" onclick="sortItems('oldest')">Oldest</button>
        <button class="pill-btn" data-sort="az" onclick="sortItems('az')">A-Z</button>
        <button class="pill-btn" data-sort="random" onclick="sortItems('random')">Random</button>
    </div>
</div>

<div class="grid-container" id="grid"></div>
<div id="sentinel" class="loading-sentinel"></div>

<script>
    let allItems = [];
    let filteredItems = [];
    let currentFilter = 'all';
    let currentSort = 'latest';
    let itemsToShow = 20;
    let currentIndex = 0;

    function toggleSortMenu() {
        document.getElementById('sortMenu').classList.toggle('show');
    }

    async function loadDatabase() {
        try {
            const response = await fetch('database.html');
            const text = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');

            const linkMap = {};
            doc.querySelectorAll('.item-links').forEach(el => {
                const uuid = el.getAttribute('data-uuid');
                const links = [];
                el.querySelectorAll('a.download-link').forEach(a => {
                    links.push({ url: a.href, label: a.querySelector('span')?.innerText || 'Download' });
                });
                if (uuid) linkMap[uuid] = links;
            });

            doc.querySelectorAll('.item').forEach(el => {
                const name = el.querySelector('h2')?.innerText;
                const img = el.querySelector('img')?.src;
                const cat = el.getAttribute('data-category') || 'addons';
                const uuid = el.getAttribute('data-uuid');
                if (name && img) {
                    allItems.push({ name, img, cat, links: linkMap[uuid] || [], uuid });
                }
            });

            processData();
        } catch (e) {
            document.getElementById('grid').innerHTML = '<div class="status-msg">Database Load Error.</div>';
        }
    }

    let debounceTimer;
    document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(processData, 250); 
    });

    function processData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        filteredItems = allItems.filter(i => {
            const matchCat = currentFilter === 'all' || i.cat.toLowerCase().includes(currentFilter);
            return matchCat && i.name.toLowerCase().includes(query);
        });

        if (currentSort === 'az') {
            filteredItems.sort((a,b) => a.name.localeCompare(b.name));
        } else if (currentSort === 'random') {
            filteredItems.sort(() => Math.random() - 0.5);
        } else if (currentSort === 'oldest') {
            filteredItems.reverse();
        }

        currentIndex = 0;
        document.getElementById('grid').innerHTML = '';
        loadMore();
    }

    function loadMore() {
        const grid = document.getElementById('grid');
        const nextSet = filteredItems.slice(currentIndex, currentIndex + itemsToShow);
        
        if (nextSet.length === 0 && currentIndex === 0) {
            grid.innerHTML = '<div class="status-msg"><i class="fas fa-ghost" style="font-size: 2em; margin-bottom: 10px; display: block;"></i>No items found.</div>';
            return;
        }

        const html = nextSet.map(item => `
            <div class="card">
                <img src="${item.img}" loading="lazy">
                <div class="card-info">
                    <div class="tag-wrapper"><span class="card-tag">${item.cat.replace(/s$/, '')}</span></div>
                    <h3 class="card-title">${item.name}</h3>
                    <div class="dl-container">
                        ${item.links.map(l => `<a href="${l.url}" class="dl-link" target="_blank"><i class="fas fa-download" style="margin-right: 5px;"></i> ${l.label.toUpperCase()}</a>`).join('')}
                    </div>
                </div>
            </div>
        `).join('');

        grid.insertAdjacentHTML('beforeend', html);
        currentIndex += itemsToShow;
    }

    const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && currentIndex < filteredItems.length) {
            loadMore();
        }
    }, { threshold: 0.1 });

    observer.observe(document.getElementById('sentinel'));

    function filterCat(cat) { 
        currentFilter = cat; 
        document.querySelectorAll('.icon-btn[data-cat]').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.icon-btn[data-cat="${cat}"]`).classList.add('active');
        processData(); 
    }

    function sortItems(type) { 
        currentSort = type; 
        document.querySelectorAll('.pill-btn[data-sort]').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.pill-btn[data-sort="${type}"]`).classList.add('active');
        processData(); 
    }

    loadDatabase();
</script>
</body>
</html>
