<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Plus</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Poppins:wght@400;600;700&family=Rubik:wght@400;600&family=Inter:wght@400;600&family=Roboto:wght@400;700&family=Ubuntu:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Default Theme Variables - Blue Starter Theme */
            --bg-color: #0b132b;
            --accent-color: #1c7ed6;
            --accent-color-2: #0f4c75;
            --accent-color-3: #3282b8;
            
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --font-color: #ffffff;
            --font-family: 'Poppins', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--font-color);
            font-family: var(--font-family);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background Blobs */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: var(--bg-color);
            overflow: hidden;
            transition: background 0.3s ease;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: blob-float 15s infinite alternate ease-in-out;
            transition: background 0.3s ease;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--accent-color); animation-delay: 0s; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: var(--accent-color-2); animation-delay: -5s; }
        .blob-3 { top: 30%; left: 40%; width: 40vw; height: 40vw; background: var(--accent-color-3); animation-delay: -10s; }

        @keyframes blob-float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15vw, 15vh) scale(1.3); }
        }

        /* Liquid Glass UI Base */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            color: var(--font-color);
        }

        /* Header Elements */
        .glass-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 15px;
        }
        
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        /* Combined Search & Actions Panel */
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            width: 220px; /* Perfectly reduced clean width */
            transition: transform 0.2s ease, width 0.2s ease, border-color 0.2s ease;
        }
        .search-box:focus-within { 
            width: 250px;
            transform: scale(1.01);
            border-color: var(--accent-color);
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--font-color);
            margin-left: 8px;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .search-box input::placeholder { color: var(--font-color); opacity: 0.6; }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }

        /* Controls (Filters & Sorting) */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px 20px;
            flex-wrap: wrap;
        }

        .filters {
            display: flex;
            gap: 10px;
            padding: 8px;
            border-radius: 20px;
        }
        .filters button {
            background: transparent;
            border: none;
            color: var(--font-color);
            font-size: 1.3rem;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filters button.active, .filters button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Custom Dropdowns */
        .custom-select {
            position: relative;
            user-select: none;
            min-width: 190px;
        }
        .select-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }
        .select-trigger:hover { background: rgba(255, 255, 255, 0.15); }
        
        .select-options {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 100%;
            border-radius: 15px;
            max-height: 200px; /* Fixed font container height limit */
            overflow-y: auto;  /* Allows fluid scrolling */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 200;
            display: flex;
            flex-direction: column;
            background: rgba(11, 19, 43, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        /* Smooth Dropdown Scroll Track */
        .select-options::-webkit-scrollbar {
            width: 6px;
        }
        .select-options::-webkit-scrollbar-track {
            background: transparent;
        }
        .select-options::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .select-options::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .custom-select.active .select-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .select-option {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s ease;
            color: #fff;
            font-size: 0.95rem;
        }
        .select-option:hover, .select-option.active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Main Elements Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 0 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            will-change: transform;
            content-visibility: auto;
            contain-intrinsic-size: 380px;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.4);
        }
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }
        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .card:hover .card-img-wrapper img { transform: scale(1.05); }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .card-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .card-links {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .download-btn {
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--font-color);
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }
        .download-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }
        .no-download { font-size: 0.85rem; opacity: 0.6; text-align: center; padding: 10px; }
        
        .loading, .no-items { grid-column: 1 / -1; text-align: center; padding: 50px; font-size: 1.2rem; opacity: 0.8; }
        
        /* Modal Theme Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content-box {
            width: 90%;
            max-width: 420px;
            padding: 25px;
            border-radius: 20px;
            transform: translateY(30px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content-box { transform: translateY(0); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }
        .setting-group { display: flex; flex-direction: column; gap: 8px; }
        .setting-group label { font-size: 0.9rem; opacity: 0.9; font-weight: 600; }
        .setting-group input[type="color"] {
            appearance: none; -webkit-appearance: none; border: none; width: 100%; height: 45px;
            border-radius: 12px; cursor: pointer; background: transparent; padding: 0;
        }
        .setting-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .setting-group input[type="color"]::-webkit-color-swatch { border: none; border-radius: 12px; }

        /* Highly Optimized Global Media Adjustments */
        @media (max-width: 768px) {
            .glass-header {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: 15px 20px;
            }
            .logo {
                font-size: 1.3rem;
            }
            .header-right {
                width: 100%;
                justify-content: center;
            }
            .search-box {
                width: 100%;
                max-width: 200px; /* Stays compact side-by-side with icons on small viewports */
            }
            .search-box:focus-within {
                width: 220px;
            }
            .grid { 
                padding: 0 15px 40px; 
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 15px;
            }
            .controls { 
                padding: 20px 15px; 
                gap: 12px;
            }
            .filters { 
                width: 100%;
                flex-wrap: wrap; 
                justify-content: center; 
            }
            .filters button {
                width: 44px;
                height: 44px;
                font-size: 1.1rem;
            }
            .custom-select { width: 100%; }
        }
        @media (max-width: 360px) {
            .search-box {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header glass">
        <div class="logo">
            <i class="fas fa-cubes"></i> Marketplace Plus
        </div>
        <div class="header-right">
            <div class="search-box glass">
                <i class="fas fa-search"></i>
                <input type="text" id="search" placeholder="Search...">
            </div>
            <a href="https://discord.gg/JfDBAtfFGM" target="_blank" class="glass icon-btn" title="Join Discord Server">
                <i class="fab fa-discord"></i>
            </a>
            <button id="settingsBtn" class="glass icon-btn" title="Theme Settings">
                <i class="fas fa-palette"></i>
            </button>
        </div>
    </header>

    <div class="controls">
        <div class="filters glass" id="categoryFilters">
            <button data-cat="all" class="active" title="All"><i class="fas fa-infinity"></i></button>
            <button data-cat="addons" title="Addons"><i class="fas fa-puzzle-piece"></i></button>
            <button data-cat="worlds" title="Maps/Worlds"><i class="fas fa-globe"></i></button>
            <button data-cat="textures" title="Texture Packs"><i class="fas fa-image"></i></button>
            <button data-cat="skins" title="Skins"><i class="fas fa-tshirt"></i></button>
            <button data-cat="mashups" title="Mashups"><i class="fas fa-layer-group"></i></button>
        </div>
        
        <div class="custom-select" id="sortDropdown">
            <div class="select-trigger glass">
                <i class="fas fa-sort-amount-down"></i>
                <span class="select-label">Random Default</span>
                <i class="fas fa-chevron-down" style="margin-left: auto; font-size: 0.8rem;"></i>
            </div>
            <div class="select-options">
                <div class="select-option active" data-value="random">Random Default</div>
                <div class="select-option" data-value="newest">Newest</div>
                <div class="select-option" data-value="oldest">Oldest</div>
                <div class="select-option" data-value="az">Name A to Z</div>
            </div>
        </div>
    </div>

    <main id="grid" class="grid"></main>

    <div id="themeModal" class="modal-overlay">
        <div class="modal-content-box glass">
            <div class="modal-header">
                <h2>Theme Settings</h2>
                <button id="closeModal" class="glass icon-btn" style="border:none;"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="setting-group">
                <label>Background Color</label>
                <input type="color" id="bgColorPicker" value="#0b132b">
            </div>
            <div class="setting-group">
                <label>Accent Color (Liquid Blobs)</label>
                <input type="color" id="accentColorPicker" value="#1c7ed6">
            </div>
            <div class="setting-group">
                <label>Glass Tint Color</label>
                <input type="color" id="glassColorPicker" value="#ffffff">
            </div>
            <div class="setting-group">
                <label>Font Color</label>
                <input type="color" id="fontColorPicker" value="#ffffff">
            </div>
            <div class="setting-group">
                <label>Font Type</label>
                
                <div class="custom-select" id="fontDropdown" style="width: 100%;">
                    <div class="select-trigger glass" style="border-radius: 12px; padding: 12px;">
                        <span class="select-label">Poppins</span>
                        <i class="fas fa-chevron-down" style="margin-left: auto; font-size: 0.8rem;"></i>
                    </div>
                    <div class="select-options" style="border-radius: 12px;">
                        <div class="select-option active" data-value="'Poppins', sans-serif">Poppins</div>
                        <div class="select-option" data-value="'Montserrat', sans-serif">Montserrat</div>
                        <div class="select-option" data-value="'Rubik', sans-serif">Rubik</div>
                        <div class="select-option" data-value="'Oswald', sans-serif">Oswald</div>
                        <div class="select-option" data-value="'Inter', sans-serif">Inter</div>
                        <div class="select-option" data-value="'Roboto', sans-serif">Roboto</div>
                        <div class="select-option" data-value="'Ubuntu', sans-serif">Ubuntu</div>
                        <div class="select-option" data-value="'Press Start 2P', cursive">Press Start 2P</div>
                    </div>
                </div>
            </div>

            <button id="resetThemeBtn" class="download-btn" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #ff6b6b; margin-top: 10px; font-weight: 700;">
                <i class="fas fa-undo"></i> Reset to Default Theme
            </button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        let items = [];
        let filteredItems = [];
        let loadedCount = 0;
        const BATCH_SIZE = 12; 
        let currentCategory = 'all';
        let sortMode = 'random';
        let searchQuery = '';
        let currentFont = "'Poppins', sans-serif";

        const defaultTheme = {
            bg: '#0b132b',
            accent: '#1c7ed6',
            glass: '#ffffff',
            fontCol: '#ffffff',
            fontFam: "'Poppins', sans-serif"
        };

        function formatCategory(cat) {
            const map = { 'addons': 'Addon', 'worlds': 'World Map', 'textures': 'Texture Pack', 'skins': 'Skin', 'mashups': 'Mashup' };
            return map[cat] || cat;
        }

        function fuzzyMatch(query, text) {
            if (!query) return true;
            const q = query.toLowerCase().replace(/[^a-z0-9]/g, '');
            const t = text.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (t.includes(q)) return true;
            let qIdx = 0;
            for (let i = 0; i < t.length; i++) {
                if (t[i] === q[qIdx]) qIdx++;
                if (qIdx === q.length) return true;
            }
            return false;
        }

        // Exact Match Proximity Logic for Ranked Search Engine
        function getSearchRelevance(title, query) {
            const t = title.toLowerCase().trim();
            const q = query.toLowerCase().trim();
            if (t === q) return 100;
            if (t.startsWith(q)) return 80;
            if (t.includes(q)) return 50;
            
            let score = 0;
            let qIdx = 0;
            for (let i = 0; i < t.length; i++) {
                if (t[i] === q[qIdx]) {
                    qIdx++;
                    score += 2;
                }
            }
            return score;
        }

        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- Theme Engine Controls ---
        function updateTheme() {
            const root = document.documentElement;
            const bg = document.getElementById('bgColorPicker').value;
            const accent = document.getElementById('accentColorPicker').value;
            const glass = document.getElementById('glassColorPicker').value;
            const fontCol = document.getElementById('fontColorPicker').value;

            root.style.setProperty('--bg-color', bg);
            root.style.setProperty('--accent-color', accent);
            root.style.setProperty('--accent-color-2', hexToRgba(accent, 0.7));
            root.style.setProperty('--accent-color-3', hexToRgba(accent, 0.4));
            root.style.setProperty('--glass-bg', hexToRgba(glass, 0.1));
            root.style.setProperty('--glass-border', hexToRgba(glass, 0.2));
            root.style.setProperty('--font-color', fontCol);
            root.style.setProperty('--font-family', currentFont);

            localStorage.setItem('mkplus-theme', JSON.stringify({ bg, accent, glass, fontCol, fontFam: currentFont }));
        }

        function loadTheme() {
            const saved = localStorage.getItem('mkplus-theme');
            if (saved) {
                const theme = JSON.parse(saved);
                document.getElementById('bgColorPicker').value = theme.bg;
                document.getElementById('accentColorPicker').value = theme.accent;
                document.getElementById('glassColorPicker').value = theme.glass;
                document.getElementById('fontColorPicker').value = theme.fontCol;
                currentFont = theme.fontFam;
                
                const fontOpts = document.querySelectorAll('#fontDropdown .select-option');
                fontOpts.forEach(opt => {
                    opt.classList.remove('active');
                    if(opt.getAttribute('data-value') === currentFont) {
                        opt.classList.add('active');
                        document.querySelector('#fontDropdown .select-label').textContent = opt.textContent;
                    }
                });

                updateTheme();
            }
        }

        ['bgColorPicker', 'accentColorPicker', 'glassColorPicker', 'fontColorPicker'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateTheme);
        });

        document.getElementById('resetThemeBtn').addEventListener('click', () => {
            document.getElementById('bgColorPicker').value = defaultTheme.bg;
            document.getElementById('accentColorPicker').value = defaultTheme.accent;
            document.getElementById('glassColorPicker').value = defaultTheme.glass;
            document.getElementById('fontColorPicker').value = defaultTheme.fontCol;
            currentFont = defaultTheme.fontFam;

            const fontOpts = document.querySelectorAll('#fontDropdown .select-option');
            fontOpts.forEach(opt => {
                opt.classList.remove('active');
                if(opt.getAttribute('data-value') === currentFont) {
                    opt.classList.add('active');
                    document.querySelector('#fontDropdown .select-label').textContent = opt.textContent;
                }
            });
            updateTheme();
        });

        // --- Setup Dropdown Framework ---
        function setupCustomDropdown(dropdownId, callback) {
            const dropdown = document.getElementById(dropdownId);
            const trigger = dropdown.querySelector('.select-trigger');
            const label = dropdown.querySelector('.select-label');
            const options = dropdown.querySelectorAll('.select-option');

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select').forEach(el => {
                    if (el !== dropdown) el.classList.remove('active');
                });
                dropdown.classList.toggle('active');
            });

            options.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    options.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    label.textContent = opt.textContent;
                    dropdown.classList.remove('active');
                    callback(opt.getAttribute('data-value'));
                });
            });
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-select').forEach(el => el.classList.remove('active'));
        });

        setupCustomDropdown('sortDropdown', (val) => { sortMode = val; applyFilters(); });
        setupCustomDropdown('fontDropdown', (val) => { currentFont = val; updateTheme(); });

        // --- Data Processor ---
        function processHTML(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            const itemNodes = doc.querySelectorAll('.item');
            const linkNodes = doc.querySelectorAll('.item-links');
            
            const linksMap = {};
            linkNodes.forEach(linkNode => {
                const uuid = linkNode.getAttribute('data-uuid');
                const dls = Array.from(linkNode.querySelectorAll('.download-link')).map(a => {
                    let text = a.textContent.trim() || 'Download';
                    const span = a.querySelector('.link-text span');
                    if (span) text = span.textContent.trim();
                    return { url: a.href, text };
                });
                linksMap[uuid] = dls;
            });

            items = Array.from(itemNodes).map((node, index) => {
                const uuid = node.getAttribute('data-uuid');
                const category = node.getAttribute('data-category') || 'addons';
                const titleEl = node.querySelector('h2');
                const title = titleEl ? titleEl.textContent.trim() : 'Unknown';
                const imgEl = node.querySelector('.img-wrapper img') || node.querySelector('img');
                const img = imgEl ? (imgEl.getAttribute('src') || '') : '';
                
                return {
                    id: index,
                    randomOrder: Math.random(),
                    uuid, category, title, img,
                    downloads: linksMap[uuid] || []
                };
            });
            applyFilters();
        }

        // --- Synchronous Uninterrupted Database Connector ---
        async function loadDatabase() {
            grid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin fa-2x"></i><p><br>Instantly connecting database...</p></div>';
            try {
                const response = await fetch('database.html');
                if (!response.ok) throw new Error('Database file query unreachable');
                const html = await response.text();
                processHTML(html);
            } catch (err) {
                grid.innerHTML = '<div class="no-items"><i class="fas fa-exclamation-circle"></i> Connection Failed. Ensure database.html resides in the root server folder.</div>';
            }
        }

        function applySortComparison(a, b) {
            if (sortMode === 'random') return a.randomOrder - b.randomOrder;
            if (sortMode === 'newest') return b.id - a.id; 
            if (sortMode === 'oldest') return a.id - b.id; 
            if (sortMode === 'az') return a.title.localeCompare(b.title);
            return 0;
        }

        // --- Core Application Filtering System ---
        function applyFilters() {
            let result = items.filter(item => {
                if (currentCategory !== 'all' && item.category !== currentCategory) return false;
                if (searchQuery) return fuzzyMatch(searchQuery, item.title);
                return true;
            });

            if (searchQuery) {
                result.sort((a, b) => {
                    const scoreA = getSearchRelevance(a.title, searchQuery);
                    const scoreB = getSearchRelevance(b.title, searchQuery);
                    if (scoreB !== scoreA) return scoreB - scoreA;
                    return applySortComparison(a, b);
                });
            } else {
                result.sort((a, b) => applySortComparison(a, b));
            }
            
            filteredItems = result;
            loadedCount = 0;
            grid.innerHTML = '';
            
            if (filteredItems.length === 0) {
                grid.innerHTML = '<div class="no-items">No items found matching your criteria.</div>';
            } else {
                loadMore();
            }
        }

        function loadMore() {
            const toLoad = filteredItems.slice(loadedCount, loadedCount + BATCH_SIZE);
            toLoad.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card glass';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.img}" loading="lazy" alt="${item.title}">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <span class="card-category">${formatCategory(item.category)}</span>
                        <div class="card-links">
                            ${item.downloads.map(dl => `
                                <a href="${dl.url}" target="_blank" class="download-btn">
                                    <i class="fas fa-download"></i> ${dl.text}
                                </a>
                            `).join('')}
                            ${item.downloads.length === 0 ? `<span class="no-download">No download links available</span>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            loadedCount += toLoad.length;
        }

        // Engine Entry Initialization
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadDatabase();
            
            document.getElementById('search').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });
            
            document.querySelectorAll('#categoryFilters button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#categoryFilters button').forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentCategory = target.getAttribute('data-cat');
                    applyFilters();
                });
            });
            
            // Modal Management
            const modal = document.getElementById('themeModal');
            document.getElementById('settingsBtn').addEventListener('click', () => modal.classList.add('active'));
            document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('active'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

            // Zero-Lag Hardware Accelerated Infinite Scroll Optimization
            let scrollFrameActive = false;
            window.addEventListener('scroll', () => {
                if (!scrollFrameActive) {
                    window.requestAnimationFrame(() => {
                        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                            if (loadedCount < filteredItems.length) loadMore();
                        }
                        scrollFrameActive = false;
                    });
                    scrollFrameActive = true;
                }
            });
        });
    </script>
</body>
</html>
